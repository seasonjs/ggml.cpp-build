name: Build & Release Multi-Platform

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux-x86_64:
    runs-on: ubuntu-22.04
    container:
      image: rocm/dev-ubuntu-22.04:6.1
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            git \
            libvulkan-dev \
            vulkan-tools \
            glslc

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure CMake
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}/install" \
            -DCMAKE_HIP_COMPILER=/opt/rocm/bin/hipcc \
            -DGGML_BUILD_ALL_PLATFORM_BACKENDS=ON \
            -DGGML_ENABLE_VULKAN=ON \
            -DGGML_ENABLE_HIP=ON

      - name: Build
        run: cmake --build build --config Release -j "$(nproc)"

      - name: Install
        run: cmake --install build --config Release --prefix install

      - name: Package
        run: |
          stage="artifact/ggml-linux-x86_64"
          mkdir -p "$stage/lib" "$stage/include" "$stage/share"
          cp -a install/include/. "$stage/include/"
          cp -a install/lib/. "$stage/lib/"
          cp -a install/share/. "$stage/share/" 2>/dev/null || true
          cp -P install/bin/libggml-*.so* "$stage/lib/" 2>/dev/null || true
          cd artifact
          tar czf ggml-linux-x86_64.tar.gz ggml-linux-x86_64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ggml-linux-x86_64
          path: artifact/ggml-linux-x86_64.tar.gz

  build-macos-arm64:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install cmake ninja

      - name: Configure CMake
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}/install" \
            -DGGML_BUILD_ALL_PLATFORM_BACKENDS=ON

      - name: Build
        run: cmake --build build --config Release -j "$(sysctl -n hw.ncpu)"

      - name: Install
        run: cmake --install build --config Release --prefix install

      - name: Package
        run: |
          stage="artifact/ggml-macos-arm64"
          mkdir -p "$stage/lib" "$stage/include" "$stage/share"
          cp -a install/include/. "$stage/include/"
          cp -a install/lib/. "$stage/lib/"
          cp -a install/share/. "$stage/share/" 2>/dev/null || true
          cp -P install/bin/libggml-*.so* "$stage/lib/" 2>/dev/null || true
          cp -P install/bin/libggml-*.dylib* "$stage/lib/" 2>/dev/null || true
          cd artifact
          tar czf ggml-macos-arm64.tar.gz ggml-macos-arm64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ggml-macos-arm64
          path: artifact/ggml-macos-arm64.tar.gz

  build-windows-x86_64:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Vulkan SDK
        uses: humbletim/setup-vulkan-sdk@v1.2.0
        with:
          vulkan-query-version: 1.3.275.0
          vulkan-components: Vulkan-Headers, Vulkan-Loader, Glslang
          vulkan-use-cache: true

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S . -B build -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INSTALL_PREFIX="${env:GITHUB_WORKSPACE}\install" `
            -DGGML_BUILD_ALL_PLATFORM_BACKENDS=ON `
            -DGGML_ENABLE_VULKAN=ON

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release -j $env:NUMBER_OF_PROCESSORS

      - name: Install
        shell: pwsh
        run: cmake --install build --config Release --prefix install

      - name: Package
        shell: pwsh
        run: |
          $stage = "artifact/ggml-windows-x86_64"
          New-Item -ItemType Directory -Force -Path "$stage/bin" | Out-Null
          New-Item -ItemType Directory -Force -Path "$stage/lib" | Out-Null
          New-Item -ItemType Directory -Force -Path "$stage/include" | Out-Null

          if (Test-Path "install/bin") {
            Copy-Item -Path "install/bin/*" -Destination "$stage/bin/" -Recurse -Force -ErrorAction SilentlyContinue
          }
          if (Test-Path "install/lib") {
            Copy-Item -Path "install/lib/*" -Destination "$stage/lib/" -Recurse -Force -ErrorAction SilentlyContinue
          }
          if (Test-Path "install/include") {
            Copy-Item -Path "install/include/*" -Destination "$stage/include/" -Recurse -Force -ErrorAction SilentlyContinue
          }

          Compress-Archive -Path $stage -DestinationPath "artifact/ggml-windows-x86_64.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ggml-windows-x86_64
          path: artifact/ggml-windows-x86_64.zip

  release:
    needs: [build-linux-x86_64, build-macos-arm64, build-windows-x86_64]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/ggml-linux-x86_64/ggml-linux-x86_64.tar.gz
            artifacts/ggml-macos-arm64/ggml-macos-arm64.tar.gz
            artifacts/ggml-windows-x86_64/ggml-windows-x86_64.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
