name: Build & Release Multi-Platform

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  WINDOWS_VULKAN_VERSION: 1.3.275.0
  WINDOWS_HIPSDK_INSTALLER_VERSION: "26.Q1"
  WINDOWS_HIP_GPU_TARGETS: "gfx1030;gfx1031;gfx1032;gfx1100;gfx1101;gfx1102;gfx1150;gfx1151;gfx1200;gfx1201"

jobs:
  build-linux-x86_64:
    runs-on: ubuntu-22.04
    container:
      image: rocm/dev-ubuntu-22.04:6.1
    steps:
      - name: Validate Linux x86_64 builder
        run: |
          arch="$(uname -m)"
          bits="$(getconf LONG_BIT)"
          cc_target="$(cc -dumpmachine)"
          cxx_target="$(c++ -dumpmachine)"
          echo "uname -m: $arch"
          echo "LONG_BIT: $bits"
          echo "cc -dumpmachine: $cc_target"
          echo "c++ -dumpmachine: $cxx_target"
          if [ "$arch" != "x86_64" ]; then
            echo "Expected x86_64 builder, got $arch" >&2
            exit 1
          fi
          if [ "$bits" != "64" ]; then
            echo "Expected 64-bit builder, got $bits-bit" >&2
            exit 1
          fi
          case "$cc_target" in
            x86_64-*|amd64-*) ;;
            *)
              echo "Expected x86_64 C compiler target, got $cc_target" >&2
              exit 1
              ;;
          esac
          case "$cxx_target" in
            x86_64-*|amd64-*) ;;
            *)
              echo "Expected x86_64 C++ compiler target, got $cxx_target" >&2
              exit 1
              ;;
          esac

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            git \
            libvulkan-dev \
            vulkan-tools \
            glslang-tools

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure CMake
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}/install" \
            -DCMAKE_HIP_COMPILER=/opt/rocm/bin/hipcc \
            -DGGML_BUILD_ALL_PLATFORM_BACKENDS=ON \
            -DGGML_ENABLE_VULKAN=ON \
            -DGGML_ENABLE_HIP=ON

      - name: Build
        run: cmake --build build --config Release -j "$(nproc)"

      - name: Install
        run: cmake --install build --config Release --prefix install

      - name: Package
        run: |
          stage="artifact/ggml-linux-x86_64"
          mkdir -p "$stage/lib" "$stage/include" "$stage/share"
          cp -a install/include/. "$stage/include/"
          cp -a install/lib/. "$stage/lib/"
          cp -a install/share/. "$stage/share/" 2>/dev/null || true
          cp -P install/bin/libggml-*.so* "$stage/lib/" 2>/dev/null || true
          cd artifact
          tar czf ggml-linux-x86_64.tar.gz ggml-linux-x86_64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ggml-linux-x86_64
          path: artifact/ggml-linux-x86_64.tar.gz
          if-no-files-found: error

  build-macos-arm64:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate macOS arm64 builder
        run: |
          arch="$(uname -m)"
          bits="$(getconf LONG_BIT)"
          cc_target="$(cc -dumpmachine)"
          cxx_target="$(c++ -dumpmachine)"
          echo "uname -m: $arch"
          echo "LONG_BIT: $bits"
          echo "cc -dumpmachine: $cc_target"
          echo "c++ -dumpmachine: $cxx_target"
          if [ "$arch" != "arm64" ]; then
            echo "Expected arm64 builder, got $arch" >&2
            exit 1
          fi
          if [ "$bits" != "64" ]; then
            echo "Expected 64-bit builder, got $bits-bit" >&2
            exit 1
          fi
          case "$cc_target" in
            arm64-*|aarch64-*) ;;
            *)
              echo "Expected arm64 C compiler target, got $cc_target" >&2
              exit 1
              ;;
          esac
          case "$cxx_target" in
            arm64-*|aarch64-*) ;;
            *)
              echo "Expected arm64 C++ compiler target, got $cxx_target" >&2
              exit 1
              ;;
          esac

      - name: Install dependencies
        run: brew install cmake ninja

      - name: Configure CMake
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
            -DCMAKE_INSTALL_RPATH="@loader_path" \
            -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}/install" \
            -DBUILD_SHARED_LIBS=ON \
            -DGGML_BACKEND_DL=ON \
            -DGGML_NATIVE=OFF \
            -DGGML_CPU=ON \
            -DGGML_CPU_ALL_VARIANTS=OFF \
            -DGGML_BUILD_ALL_PLATFORM_BACKENDS=OFF \
            -DGGML_METAL=ON \
            -DGGML_METAL_EMBED_LIBRARY=ON \
            -DGGML_ACCELERATE=ON \
            -DGGML_BLAS=ON \
            -DGGML_BLAS_VENDOR=Apple

      - name: Build
        run: cmake --build build --config Release -j "$(sysctl -n hw.ncpu)"

      - name: Install
        run: cmake --install build --config Release --prefix install

      - name: Package
        run: |
          stage="artifact/ggml-macos-arm64"
          mkdir -p "$stage/lib" "$stage/include" "$stage/share"
          cp -a install/include/. "$stage/include/"
          cp -a install/lib/. "$stage/lib/"
          cp -a install/share/. "$stage/share/" 2>/dev/null || true
          cp -P install/bin/libggml-*.so* "$stage/lib/" 2>/dev/null || true
          cp -P install/bin/libggml-*.dylib* "$stage/lib/" 2>/dev/null || true
          cd artifact
          tar czf ggml-macos-arm64.tar.gz ggml-macos-arm64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ggml-macos-arm64
          path: artifact/ggml-macos-arm64.tar.gz
          if-no-files-found: error

  build-windows-x86_64-base:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Windows x86_64 runner
        shell: pwsh
        run: |
          Write-Host "PROCESSOR_ARCHITECTURE=$env:PROCESSOR_ARCHITECTURE"
          Write-Host "Is64BitOS=$([Environment]::Is64BitOperatingSystem)"
          Write-Host "Is64BitProcess=$([Environment]::Is64BitProcess)"
          if (-not [Environment]::Is64BitOperatingSystem) {
            Write-Error "Expected 64-bit Windows runner"
            exit 1
          }
          if ($env:PROCESSOR_ARCHITECTURE -ne "AMD64") {
            Write-Error "Expected AMD64 runner, got $env:PROCESSOR_ARCHITECTURE"
            exit 1
          }

      - name: Install Vulkan SDK
        uses: humbletim/setup-vulkan-sdk@v1.2.0
        with:
          vulkan-query-version: ${{ env.WINDOWS_VULKAN_VERSION }}
          vulkan-components: Vulkan-Headers, Vulkan-Loader, Glslang
          vulkan-use-cache: false

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S . -B build/base -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INSTALL_PREFIX="${env:GITHUB_WORKSPACE}\install\base" `
            -DGGML_BUILD_ALL_PLATFORM_BACKENDS=OFF `
            -DBUILD_SHARED_LIBS=ON `
            -DGGML_BACKEND_DL=ON `
            -DGGML_NATIVE=OFF `
            -DGGML_CPU=ON `
            -DGGML_CPU_ALL_VARIANTS=ON `
            -DGGML_VULKAN=ON `
            -DGGML_CUDA=OFF `
            -DGGML_HIP=OFF

      - name: Build
        shell: pwsh
        run: cmake --build build/base --config Release -j $env:NUMBER_OF_PROCESSORS

      - name: Install
        shell: pwsh
        run: cmake --install build/base --config Release --prefix install/base

      - name: Stage artifact
        shell: pwsh
        run: |
          $stage = "artifact/windows-base"
          New-Item -ItemType Directory -Force -Path "$stage/bin" | Out-Null
          New-Item -ItemType Directory -Force -Path "$stage/lib" | Out-Null
          New-Item -ItemType Directory -Force -Path "$stage/include" | Out-Null

          if (Test-Path "install/base/bin") {
            Copy-Item -Path "install/base/bin/*" -Destination "$stage/bin/" -Recurse -Force -ErrorAction SilentlyContinue
          }
          if (Test-Path "install/base/lib") {
            Copy-Item -Path "install/base/lib/*" -Destination "$stage/lib/" -Recurse -Force -ErrorAction SilentlyContinue
          }
          if (Test-Path "install/base/include") {
            Copy-Item -Path "install/base/include/*" -Destination "$stage/include/" -Recurse -Force -ErrorAction SilentlyContinue
          }
          if (Test-Path "install/base/share") {
            New-Item -ItemType Directory -Force -Path "$stage/share" | Out-Null
            Copy-Item -Path "install/base/share/*" -Destination "$stage/share/" -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ggml-windows-x86_64-base
          path: artifact/windows-base
          if-no-files-found: error

  build-windows-x86_64-cuda:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Windows x86_64 runner
        shell: pwsh
        run: |
          Write-Host "PROCESSOR_ARCHITECTURE=$env:PROCESSOR_ARCHITECTURE"
          Write-Host "Is64BitOS=$([Environment]::Is64BitOperatingSystem)"
          Write-Host "Is64BitProcess=$([Environment]::Is64BitProcess)"
          if (-not [Environment]::Is64BitOperatingSystem) {
            Write-Error "Expected 64-bit Windows runner"
            exit 1
          }
          if ($env:PROCESSOR_ARCHITECTURE -ne "AMD64") {
            Write-Error "Expected AMD64 runner, got $env:PROCESSOR_ARCHITECTURE"
            exit 1
          }

      - name: Install CUDA Toolkit 12.4
        uses: Jimver/cuda-toolkit@v0.2.21
        with:
          cuda: '12.4.1'
          method: 'network'

      - name: Verify CUDA toolkit
        shell: pwsh
        run: |
          if (-not $env:CUDA_PATH) {
            Write-Error "CUDA_PATH is not set"
            exit 1
          }
          if (-not (Test-Path "$env:CUDA_PATH\bin\nvcc.exe")) {
            Write-Error "nvcc not found under CUDA_PATH=$env:CUDA_PATH"
            exit 1
          }
          Write-Host "CUDA_PATH=$env:CUDA_PATH"

      - name: Install Ninja
        shell: pwsh
        run: choco install ninja -y

      - name: Build ggml-cuda
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          echo VSCMD_ARG_TGT_ARCH=%VSCMD_ARG_TGT_ARCH%
          if /I not "%VSCMD_ARG_TGT_ARCH%"=="x64" (
            echo Expected x64 MSVC toolchain, got %VSCMD_ARG_TGT_ARCH%
            exit /b 1
          )
          cmake -S . -B build\cuda -G "Ninja Multi-Config" ^
            -DGGML_BUILD_ALL_PLATFORM_BACKENDS=OFF ^
            -DBUILD_SHARED_LIBS=ON ^
            -DGGML_BACKEND_DL=ON ^
            -DGGML_NATIVE=OFF ^
            -DGGML_CPU=OFF ^
            -DGGML_VULKAN=OFF ^
            -DGGML_HIP=OFF ^
            -DGGML_CUDA=ON ^
            -DCUDAToolkit_ROOT="%CUDA_PATH%" ^
            -DGGML_CUDA_CUB_3DOT2=ON
          set /A NINJA_JOBS=%NUMBER_OF_PROCESSORS%-1
          if %NINJA_JOBS% LSS 1 set NINJA_JOBS=1
          cmake --build build\cuda --config Release -j %NINJA_JOBS% --target ggml-cuda

      - name: Stage artifact
        shell: pwsh
        run: |
          $runtimeDir = "build/cuda/bin/cudart"
          New-Item -ItemType Directory -Force -Path $runtimeDir | Out-Null

          foreach ($root in @("$env:CUDA_PATH\bin", "$env:CUDA_PATH\lib", "$env:CUDA_PATH\bin\x64")) {
            if (Test-Path $root) {
              Copy-Item -Path "$root\cudart64_*.dll" -Destination $runtimeDir -Force -ErrorAction SilentlyContinue
              Copy-Item -Path "$root\cublas64_*.dll" -Destination $runtimeDir -Force -ErrorAction SilentlyContinue
              Copy-Item -Path "$root\cublasLt64_*.dll" -Destination $runtimeDir -Force -ErrorAction SilentlyContinue
            }
          }

          $stage = "artifact/windows-cuda"
          New-Item -ItemType Directory -Force -Path "$stage/bin" | Out-Null
          Copy-Item -Path "build/cuda/bin/Release/ggml-cuda.dll" -Destination "$stage/bin/" -Force
          Copy-Item -Path "$runtimeDir/*" -Destination "$stage/bin/" -Force -ErrorAction SilentlyContinue

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ggml-windows-x86_64-cuda
          path: artifact/windows-cuda
          if-no-files-found: error

  build-windows-x86_64-hip:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Windows x86_64 runner
        shell: pwsh
        run: |
          Write-Host "PROCESSOR_ARCHITECTURE=$env:PROCESSOR_ARCHITECTURE"
          Write-Host "Is64BitOS=$([Environment]::Is64BitOperatingSystem)"
          Write-Host "Is64BitProcess=$([Environment]::Is64BitProcess)"
          if (-not [Environment]::Is64BitOperatingSystem) {
            Write-Error "Expected 64-bit Windows runner"
            exit 1
          }
          if ($env:PROCESSOR_ARCHITECTURE -ne "AMD64") {
            Write-Error "Expected AMD64 runner, got $env:PROCESSOR_ARCHITECTURE"
            exit 1
          }

      - name: Grab rocWMMA package
        shell: pwsh
        run: |
          curl -o rocwmma.deb "https://repo.radeon.com/rocm/apt/7.2/pool/main/r/rocwmma-dev/rocwmma-dev_2.2.0.70200-43~24.04_amd64.deb"
          7z x rocwmma.deb
          7z x data.tar

      - name: Cache ROCm installation
        id: cache-rocm
        uses: actions/cache@v4
        with:
          path: C:\Program Files\AMD\ROCm
          key: rocm-${{ env.WINDOWS_HIPSDK_INSTALLER_VERSION }}-${{ runner.os }}

      - name: Install AMD HIP SDK
        if: steps.cache-rocm.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Write-Host "Downloading AMD HIP SDK Installer"
          Invoke-WebRequest `
            -Uri "https://download.amd.com/developer/eula/rocm-hub/AMD-Software-PRO-Edition-$($env:WINDOWS_HIPSDK_INSTALLER_VERSION)-Win11-For-HIP.exe" `
            -OutFile "${env:RUNNER_TEMP}\rocm-install.exe"
          Write-Host "Installing AMD HIP SDK"
          $proc = Start-Process "${env:RUNNER_TEMP}\rocm-install.exe" -ArgumentList '-install' -NoNewWindow -PassThru
          $completed = $proc.WaitForExit(600000)
          if (-not $completed) {
            Write-Error "ROCm installation timed out after 10 minutes"
            $proc.Kill()
            exit 1
          }
          if ($proc.ExitCode -ne 0) {
            Write-Error "ROCm installation failed with exit code $($proc.ExitCode)"
            exit 1
          }
          Write-Host "Completed AMD HIP SDK installation"

      - name: Verify AMD HIP SDK
        shell: pwsh
        run: |
          $clangPath = Get-ChildItem 'C:\Program Files\AMD\ROCm\*\bin\clang.exe' | Select-Object -First 1
          if (-not $clangPath) {
            Write-Error "ROCm installation not found"
            exit 1
          }
          & $clangPath.FullName --version
          $target = & $clangPath.FullName -dumpmachine
          Write-Host "HIP clang target: $target"
          if ($target -notmatch 'x86_64|amd64') {
            Write-Error "Expected x86_64 HIP clang target, got $target"
            exit 1
          }

      - name: Build ggml-hip
        shell: pwsh
        run: |
          $env:HIP_PATH = (Resolve-Path 'C:\Program Files\AMD\ROCm\*\bin\clang.exe' | Split-Path | Split-Path)
          $env:CMAKE_PREFIX_PATH = "$env:HIP_PATH"
          cmake -G "Unix Makefiles" -B build/hip -S . `
            -DCMAKE_BUILD_TYPE=Release `
            -DGGML_BUILD_ALL_PLATFORM_BACKENDS=OFF `
            -DBUILD_SHARED_LIBS=ON `
            -DGGML_BACKEND_DL=ON `
            -DGGML_NATIVE=OFF `
            -DGGML_CPU=OFF `
            -DGGML_VULKAN=OFF `
            -DGGML_CUDA=OFF `
            -DGGML_HIP=ON `
            -DGPU_TARGETS="$env:WINDOWS_HIP_GPU_TARGETS" `
            -DGGML_HIP_ROCWMMA_FATTN=ON `
            -DCMAKE_C_COMPILER="$env:HIP_PATH\bin\clang.exe" `
            -DCMAKE_CXX_COMPILER="$env:HIP_PATH\bin\clang++.exe" `
            -DCMAKE_CXX_FLAGS="-I$($PWD.Path.Replace('\\', '/'))/opt/rocm-7.2.0/include/ -Wno-ignored-attributes -Wno-nested-anon-types"
          cmake --build build/hip --target ggml-hip -j $env:NUMBER_OF_PROCESSORS

          New-Item -ItemType Directory -Force -Path "build/hip/bin/rocblas/library" | Out-Null
          New-Item -ItemType Directory -Force -Path "build/hip/bin/hipblaslt/library" | Out-Null

          Copy-Item -Path "$env:HIP_PATH\bin\amd_comgr*.dll" -Destination "build/hip/bin/" -Force -ErrorAction SilentlyContinue
          Copy-Item -Path "$env:HIP_PATH\bin\amdhip64*.dll" -Destination "build/hip/bin/" -Force -ErrorAction SilentlyContinue
          Copy-Item -Path "$env:HIP_PATH\bin\hipblas.dll" -Destination "build/hip/bin/" -Force -ErrorAction SilentlyContinue
          Copy-Item -Path "$env:HIP_PATH\bin\libhipblas*.dll" -Destination "build/hip/bin/" -Force -ErrorAction SilentlyContinue
          Copy-Item -Path "$env:HIP_PATH\bin\rocblas.dll" -Destination "build/hip/bin/" -Force -ErrorAction SilentlyContinue
          Copy-Item -Path "$env:HIP_PATH\bin\rocblas\library\*" -Destination "build/hip/bin/rocblas/library/" -Force -Recurse -ErrorAction SilentlyContinue
          Copy-Item -Path "$env:HIP_PATH\bin\hipblaslt\library\*" -Destination "build/hip/bin/hipblaslt/library/" -Force -Recurse -ErrorAction SilentlyContinue

      - name: Stage artifact
        shell: pwsh
        run: |
          $stage = "artifact/windows-hip"
          New-Item -ItemType Directory -Force -Path "$stage/bin" | Out-Null
          Copy-Item -Path "build/hip/bin/*" -Destination "$stage/bin/" -Recurse -Force -ErrorAction SilentlyContinue

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ggml-windows-x86_64-hip
          path: artifact/windows-hip
          if-no-files-found: error

  assemble-windows-x86_64:
    needs:
      - build-windows-x86_64-base
      - build-windows-x86_64-cuda
      - build-windows-x86_64-hip
    runs-on: windows-2022
    steps:
      - name: Download base artifact
        uses: actions/download-artifact@v4
        with:
          name: ggml-windows-x86_64-base
          path: parts/base

      - name: Download CUDA artifact
        uses: actions/download-artifact@v4
        with:
          name: ggml-windows-x86_64-cuda
          path: parts/cuda

      - name: Download HIP artifact
        uses: actions/download-artifact@v4
        with:
          name: ggml-windows-x86_64-hip
          path: parts/hip

      - name: Merge Windows artifact
        shell: pwsh
        run: |
          $stage = "artifact/ggml-windows-x86_64"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          Copy-Item -Path "parts/base/windows-base/*" -Destination $stage -Recurse -Force
          Copy-Item -Path "parts/cuda/windows-cuda/bin/*" -Destination "$stage/bin/" -Force -ErrorAction SilentlyContinue
          Copy-Item -Path "parts/hip/windows-hip/bin/*" -Destination "$stage/bin/" -Recurse -Force -ErrorAction SilentlyContinue

          $manifest = @{
            package = "ggml-windows-x86_64"
            generated_at = (Get-Date).ToUniversalTime().ToString("o")
            core_files = @(
              Get-ChildItem "$stage/bin/ggml.dll", "$stage/bin/ggml-base.dll" -ErrorAction SilentlyContinue |
                Sort-Object Name |
                ForEach-Object { "bin/$($_.Name)" }
            )
            import_libraries = @(
              Get-ChildItem "$stage/lib/*.lib" -ErrorAction SilentlyContinue |
                Sort-Object Name |
                ForEach-Object { "lib/$($_.Name)" }
            )
            backends = @(
              @{
                name = "cpu"
                files = @(
                  Get-ChildItem "$stage/bin/ggml-cpu-*.dll" -ErrorAction SilentlyContinue |
                    Sort-Object Name |
                    ForEach-Object { "bin/$($_.Name)" }
                )
                runtime = "bundled"
              },
              @{
                name = "vulkan"
                files = @(
                  Get-ChildItem "$stage/bin/ggml-vulkan.dll" -ErrorAction SilentlyContinue |
                    Sort-Object Name |
                    ForEach-Object { "bin/$($_.Name)" }
                )
                runtime = "requires system Vulkan loader and GPU driver"
              },
              @{
                name = "cuda"
                files = @(
                  Get-ChildItem "$stage/bin/ggml-cuda.dll", "$stage/bin/cudart64_*.dll", "$stage/bin/cublas64_*.dll", "$stage/bin/cublasLt64_*.dll" -ErrorAction SilentlyContinue |
                    Sort-Object Name |
                    ForEach-Object { "bin/$($_.Name)" }
                )
                runtime = "bundled CUDA user-mode libraries; NVIDIA driver still required"
              },
              @{
                name = "hip"
                files = @(
                  Get-ChildItem "$stage/bin/ggml-hip.dll", "$stage/bin/amd_comgr*.dll", "$stage/bin/amdhip64*.dll", "$stage/bin/hipblas.dll", "$stage/bin/libhipblas*.dll", "$stage/bin/rocblas.dll" -ErrorAction SilentlyContinue |
                    Sort-Object Name |
                    ForEach-Object { "bin/$($_.Name)" }
                )
                runtime = "bundled ROCm user-mode libraries; compatible AMD driver still required"
                extra_paths = @(
                  "bin/rocblas/library",
                  "bin/hipblaslt/library"
                )
              }
            )
          }

          $manifest | ConvertTo-Json -Depth 6 | Set-Content -Path "$stage/backend-manifest.json" -Encoding utf8
          Compress-Archive -Path $stage -DestinationPath "artifact/ggml-windows-x86_64.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ggml-windows-x86_64
          path: artifact/ggml-windows-x86_64.zip
          if-no-files-found: error

  release:
    needs:
      - build-linux-x86_64
      - build-macos-arm64
      - assemble-windows-x86_64
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/ggml-linux-x86_64/ggml-linux-x86_64.tar.gz
            artifacts/ggml-macos-arm64/ggml-macos-arm64.tar.gz
            artifacts/ggml-windows-x86_64/ggml-windows-x86_64.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
