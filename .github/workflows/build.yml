name: Build & Release Multi-Platform

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create new release'
        required: true
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  VULKAN_VERSION: 1.4.313.2
  WINDOWS_HIPSDK_INSTALLER_VERSION: "26.Q1"
  WINDOWS_HIP_GPU_TARGETS: "gfx1030;gfx1031;gfx1032;gfx1100;gfx1101;gfx1102;gfx1150;gfx1151;gfx1200;gfx1201"
  LINUX_ROCM_VERSION: "7.2"
  LINUX_HIP_GPU_TARGETS: "gfx908;gfx90a;gfx942;gfx1030;gfx1100;gfx1101;gfx1150;gfx1151;gfx1200;gfx1201"

jobs:
  build-linux-x86_64-base:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential git cmake ninja-build wget libssl-dev
          wget -qO - https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo apt-key add -
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-jammy.list https://packages.lunarg.com/vulkan/lunarg-vulkan-jammy.list
          sudo apt-get update -y
          sudo apt-get install -y build-essential mesa-vulkan-drivers vulkan-sdk libssl-dev

      - name: ccache
        uses: ggml-org/ccache-action@v1.2.21
        with:
          key: linux-x86_64-base
          evict-old-files: 10d

      - name: Configure CMake
        run: |
          cmake -S . -B build/base -G Ninja \
            -DCMAKE_INSTALL_RPATH='$ORIGIN' \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}/install/base" \
            -DBUILD_SHARED_LIBS=ON \
            -DGGML_BACKEND_DL=ON \
            -DGGML_NATIVE=OFF \
            -DGGML_CPU=ON \
            -DGGML_CPU_ALL_VARIANTS=ON \
            -DGGML_VULKAN=ON \
            -DGGML_HIP=OFF

      - name: Build
        run: cmake --build build/base --config Release -j "$(nproc)"

      - name: Install
        run: cmake --install build/base --config Release --prefix install/base

      - name: Validate exported CMake package
        run: |
          config_file="install/base/lib/cmake/ggml/ggml-config.cmake"
          test -f "$config_file"
          count="$(grep -c 'INTERFACE_INCLUDE_DIRECTORIES "${GGML_INCLUDE_DIR}"' "$config_file" || true)"
          test "$count" -ge 2

      - name: Stage artifact
        run: |
          stage="artifact/linux-base"
          mkdir -p "$stage/bin" "$stage/lib" "$stage/include"
          cp -a install/base/include/. "$stage/include/" 2>/dev/null || true
          cp -a install/base/lib/. "$stage/lib/" 2>/dev/null || true
          cp -a install/base/bin/. "$stage/bin/" 2>/dev/null || true
          cp -P install/base/bin/libggml-*.so* "$stage/lib/" 2>/dev/null || true
          if [ -d install/base/share ]; then
            mkdir -p "$stage/share"
            cp -a install/base/share/. "$stage/share/"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ggml-linux-x86_64-base
          path: artifact/linux-base
          if-no-files-found: error

  build-linux-x86_64-rocm:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential git cmake ninja-build wget libssl-dev

      - name: Setup ROCm
        run: |
          sudo mkdir --parents --mode=0755 /etc/apt/keyrings
          wget https://repo.radeon.com/rocm/rocm.gpg.key -O - | \
            gpg --dearmor | sudo tee /etc/apt/keyrings/rocm.gpg > /dev/null

          sudo tee /etc/apt/sources.list.d/rocm.list << EOF
          deb [arch=amd64 signed-by=/etc/apt/keyrings/rocm.gpg] https://repo.radeon.com/rocm/apt/${{ env.LINUX_ROCM_VERSION }} jammy main
          EOF

          sudo tee /etc/apt/preferences.d/rocm-pin-600 << EOF
          Package: *
          Pin: release o=repo.radeon.com
          Pin-Priority: 600
          EOF

          sudo apt-get update -y
          sudo apt-get install -y rocm-hip-sdk

      - name: ccache
        uses: ggml-org/ccache-action@v1.2.21
        with:
          key: linux-x86_64-rocm-${{ env.LINUX_ROCM_VERSION }}
          evict-old-files: 10d

      - name: Configure CMake
        run: |
          hip_clang="$(hipconfig -l)/clang"
          if [ ! -x "$hip_clang" ]; then
            hip_clang="/opt/rocm/bin/clang"
          fi
          echo "Using HIP compiler: $hip_clang"
          cmake -S . -B build/rocm -G Ninja \
            -DCMAKE_INSTALL_RPATH='$ORIGIN' \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}/install/rocm" \
            -DCMAKE_HIP_COMPILER="$hip_clang" \
            -DBUILD_SHARED_LIBS=ON \
            -DGGML_BACKEND_DL=ON \
            -DGGML_NATIVE=OFF \
            -DGGML_CPU=OFF \
            -DGGML_CPU_ALL_VARIANTS=OFF \
            -DGGML_VULKAN=OFF \
            -DGGML_HIP=ON \
            -DHIP_PLATFORM=amd \
            -DGPU_TARGETS="${LINUX_HIP_GPU_TARGETS}"

      - name: Build
        run: cmake --build build/rocm --config Release -j "$(nproc)"

      - name: Install
        run: cmake --install build/rocm --config Release --prefix install/rocm

      - name: Stage artifact
        run: |
          stage="artifact/linux-rocm"
          mkdir -p "$stage/bin" "$stage/lib" "$stage/include"
          cp -a install/rocm/include/. "$stage/include/" 2>/dev/null || true
          cp -a install/rocm/lib/. "$stage/lib/" 2>/dev/null || true
          cp -a install/rocm/bin/. "$stage/bin/" 2>/dev/null || true
          cp -P install/rocm/bin/libggml-*.so* "$stage/lib/" 2>/dev/null || true
          if [ -d install/rocm/share ]; then
            mkdir -p "$stage/share"
            cp -a install/rocm/share/. "$stage/share/"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ggml-linux-x86_64-rocm
          path: artifact/linux-rocm
          if-no-files-found: error

  assemble-linux-x86_64:
    needs:
      - build-linux-x86_64-base
      - build-linux-x86_64-rocm
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21

      - name: Download base artifact
        uses: actions/download-artifact@v4
        with:
          name: ggml-linux-x86_64-base
          path: parts/base

      - name: Download ROCm artifact
        uses: actions/download-artifact@v4
        with:
          name: ggml-linux-x86_64-rocm
          path: parts/rocm

      - name: Merge Linux artifact
        shell: bash
        run: |
          stage="artifact/ggml-linux-x86_64"
          mkdir -p "$stage"

          cp -a parts/base/. "$stage/"
          cp -a parts/rocm/lib/. "$stage/lib/" 2>/dev/null || true
          cp -a parts/rocm/bin/. "$stage/bin/" 2>/dev/null || true

          bun run generate-manifest \
            --stage "$stage" \
            --output "$stage/manifests.json" \
            --artifact-name "ggml-linux-x86_64" \
            --package-type "sdk-overlay" \
            --merge-target "ggml-sdk" \
            --os "linux" \
            --arch "x86_64" \
            --archive-format "tar.gz" \
            --archive-file "ggml-linux-x86_64.tar.gz" \
            --manifest-file "manifests.json" \
            --component "base" \
            --component "rocm" \
            --backend "cpu" \
            --backend "vulkan" \
            --backend "rocm" \
            --source-part "ggml-linux-x86_64-base" \
            --source-part "ggml-linux-x86_64-rocm" \
            --component-map "base|ggml-linux-x86_64-base|parts/base|." \
            --component-map "rocm|ggml-linux-x86_64-rocm|parts/rocm/lib|lib" \
            --component-map "rocm|ggml-linux-x86_64-rocm|parts/rocm/bin|bin"
          cp "$stage/manifests.json" "artifact/ggml-linux-x86_64.manifests.json"

          tar czf artifact/ggml-linux-x86_64.tar.gz -C artifact ggml-linux-x86_64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ggml-linux-x86_64
          path: |
            artifact/ggml-linux-x86_64.tar.gz
            artifact/ggml-linux-x86_64.manifests.json
          if-no-files-found: error

  build-macos-arm64:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: ccache
        uses: ggml-org/ccache-action@v1.2.21
        with:
          key: macos-arm64
          evict-old-files: 10d

      - name: Validate macOS arm64 builder
        run: |
          arch="$(uname -m)"
          bits="$(getconf LONG_BIT)"
          cc_target="$(cc -dumpmachine)"
          cxx_target="$(c++ -dumpmachine)"
          echo "uname -m: $arch"
          echo "LONG_BIT: $bits"
          echo "cc -dumpmachine: $cc_target"
          echo "c++ -dumpmachine: $cxx_target"
          if [ "$arch" != "arm64" ]; then
            echo "Expected arm64 builder, got $arch" >&2
            exit 1
          fi
          if [ "$bits" != "64" ]; then
            echo "Expected 64-bit builder, got $bits-bit" >&2
            exit 1
          fi
          case "$cc_target" in
            arm64-*|aarch64-*) ;;
            *)
              echo "Expected arm64 C compiler target, got $cc_target" >&2
              exit 1
              ;;
          esac
          case "$cxx_target" in
            arm64-*|aarch64-*) ;;
            *)
              echo "Expected arm64 C++ compiler target, got $cxx_target" >&2
              exit 1
              ;;
          esac

      - name: Install dependencies
        run: brew install cmake ninja

      - name: Configure CMake
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
            -DCMAKE_INSTALL_RPATH="@loader_path" \
            -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}/install" \
            -DBUILD_SHARED_LIBS=ON \
            -DGGML_BACKEND_DL=ON \
            -DGGML_NATIVE=OFF \
            -DGGML_CPU=ON \
            -DGGML_CPU_ALL_VARIANTS=OFF \
            -DGGML_METAL=ON \
            -DGGML_METAL_EMBED_LIBRARY=ON \
            -DGGML_ACCELERATE=ON \
            -DGGML_BLAS=ON \
            -DGGML_BLAS_VENDOR=Apple

      - name: Build
        run: cmake --build build --config Release -j "$(sysctl -n hw.ncpu)"

      - name: Install
        run: cmake --install build --config Release --prefix install

      - name: Validate exported CMake package
        run: |
          config_file="install/lib/cmake/ggml/ggml-config.cmake"
          test -f "$config_file"
          count="$(grep -c 'INTERFACE_INCLUDE_DIRECTORIES "${GGML_INCLUDE_DIR}"' "$config_file" || true)"
          test "$count" -ge 2

      - name: Package
        run: |
          stage="artifact/ggml-macos-arm64"
          mkdir -p "$stage/lib" "$stage/include" "$stage/share"
          cp -a install/include/. "$stage/include/"
          cp -a install/lib/. "$stage/lib/"
          cp -a install/share/. "$stage/share/" 2>/dev/null || true
          cp -P install/bin/libggml-*.so* "$stage/lib/" 2>/dev/null || true
          cp -P install/bin/libggml-*.dylib* "$stage/lib/" 2>/dev/null || true
          cd artifact
          tar czf ggml-macos-arm64.tar.gz ggml-macos-arm64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ggml-macos-arm64
          path: artifact/ggml-macos-arm64.tar.gz
          if-no-files-found: error

  build-windows-x86_64-base:
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: ccache
        uses: ggml-org/ccache-action@v1.2.21
        with:
          key: windows-x86_64-base
          variant: ccache
          evict-old-files: 10d

      - name: Validate Windows x86_64 runner
        shell: pwsh
        run: |
          Write-Host "PROCESSOR_ARCHITECTURE=$env:PROCESSOR_ARCHITECTURE"
          Write-Host "Is64BitOS=$([Environment]::Is64BitOperatingSystem)"
          Write-Host "Is64BitProcess=$([Environment]::Is64BitProcess)"
          if (-not [Environment]::Is64BitOperatingSystem) {
            Write-Error "Expected 64-bit Windows runner"
            exit 1
          }
          if ($env:PROCESSOR_ARCHITECTURE -ne "AMD64") {
            Write-Error "Expected AMD64 runner, got $env:PROCESSOR_ARCHITECTURE"
            exit 1
          }

      - name: Install Vulkan SDK
        id: get_vulkan
        shell: pwsh
        run: |
          curl.exe -o "$env:RUNNER_TEMP\VulkanSDK-Installer.exe" -L "https://sdk.lunarg.com/sdk/download/${env:VULKAN_VERSION}/windows/vulkansdk-windows-X64-${env:VULKAN_VERSION}.exe"
          & "$env:RUNNER_TEMP\VulkanSDK-Installer.exe" --accept-licenses --default-answer --confirm-command install
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=C:\VulkanSDK\${env:VULKAN_VERSION}"
          Add-Content $env:GITHUB_PATH "C:\VulkanSDK\${env:VULKAN_VERSION}\bin"

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S . -B build/base -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INSTALL_PREFIX="${env:GITHUB_WORKSPACE}\install\base" `
            -DCMAKE_CXX_FLAGS_RELEASE="/O2 /Ob2 /Zi /DNDEBUG" `
            -DCMAKE_C_FLAGS_RELEASE="/O2 /Ob2 /Zi /DNDEBUG" `
            -DCMAKE_SHARED_LINKER_FLAGS_RELEASE="/DEBUG /OPT:REF /OPT:ICF" `
            -DBUILD_SHARED_LIBS=ON `
            -DGGML_BACKEND_DL=ON `
            -DGGML_NATIVE=OFF `
            -DGGML_CPU=ON `
            -DGGML_CPU_ALL_VARIANTS=ON `
            -DGGML_VULKAN=ON `
            -DGGML_CUDA=OFF `
            -DGGML_HIP=OFF

      - name: Build
        shell: pwsh
        run: cmake --build build/base --config Release -j $env:NUMBER_OF_PROCESSORS

      - name: Install
        shell: pwsh
        run: cmake --install build/base --config Release --prefix install/base

      - name: Validate exported CMake package
        shell: pwsh
        run: |
          $configFile = "install/base/lib/cmake/ggml/ggml-config.cmake"
          if (-not (Test-Path $configFile)) {
            Write-Error "Missing exported package config: $configFile"
            exit 1
          }
          $count = (Select-String -Path $configFile -Pattern 'INTERFACE_INCLUDE_DIRECTORIES "\$\{GGML_INCLUDE_DIR\}"' -AllMatches).Matches.Count
          if ($count -lt 2) {
            Write-Error "Expected ggml::ggml and ggml::ggml-base to export INTERFACE_INCLUDE_DIRECTORIES"
            exit 1
          }

      - name: Stage artifact
        shell: pwsh
        run: |
          $stage = "artifact/windows-base"
          New-Item -ItemType Directory -Force -Path "$stage/bin" | Out-Null
          New-Item -ItemType Directory -Force -Path "$stage/lib" | Out-Null
          New-Item -ItemType Directory -Force -Path "$stage/include" | Out-Null

          if (Test-Path "install/base/bin") {
            Copy-Item -Path "install/base/bin/*" -Destination "$stage/bin/" -Recurse -Force -ErrorAction SilentlyContinue
          }
          if (Test-Path "install/base/lib") {
            Copy-Item -Path "install/base/lib/*" -Destination "$stage/lib/" -Recurse -Force -ErrorAction SilentlyContinue
          }
          if (Test-Path "install/base/include") {
            Copy-Item -Path "install/base/include/*" -Destination "$stage/include/" -Recurse -Force -ErrorAction SilentlyContinue
          }
          if (Test-Path "install/base/share") {
            New-Item -ItemType Directory -Force -Path "$stage/share" | Out-Null
            Copy-Item -Path "install/base/share/*" -Destination "$stage/share/" -Recurse -Force -ErrorAction SilentlyContinue
          }
          # Collect PDB files from build tree so third-party consumers can symbolize crash dumps
          Get-ChildItem -Path "build/base" -Filter "*.pdb" -Recurse -ErrorAction SilentlyContinue |
            ForEach-Object { Copy-Item -Path $_.FullName -Destination "$stage/bin/" -Force }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ggml-windows-x86_64-base
          path: artifact/windows-base
          if-no-files-found: error

  build-windows-x86_64-cuda:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: ccache
        uses: ggml-org/ccache-action@v1.2.21
        with:
          key: windows-x86_64-cuda
          variant: ccache
          evict-old-files: 10d

      - name: Validate Windows x86_64 runner
        shell: pwsh
        run: |
          Write-Host "PROCESSOR_ARCHITECTURE=$env:PROCESSOR_ARCHITECTURE"
          Write-Host "Is64BitOS=$([Environment]::Is64BitOperatingSystem)"
          Write-Host "Is64BitProcess=$([Environment]::Is64BitProcess)"
          if (-not [Environment]::Is64BitOperatingSystem) {
            Write-Error "Expected 64-bit Windows runner"
            exit 1
          }
          if ($env:PROCESSOR_ARCHITECTURE -ne "AMD64") {
            Write-Error "Expected AMD64 runner, got $env:PROCESSOR_ARCHITECTURE"
            exit 1
          }

      - name: Install CUDA Toolkit
        uses: ./.github/actions/windows-setup-cuda
        with:
          cuda_version: '12.4'

      - name: Verify CUDA toolkit
        shell: pwsh
        run: |
          if (-not $env:CUDA_PATH) {
            Write-Error "CUDA_PATH is not set"
            exit 1
          }
          if (-not (Test-Path "$env:CUDA_PATH\bin\nvcc.exe")) {
            Write-Error "nvcc not found under CUDA_PATH=$env:CUDA_PATH"
            exit 1
          }
          Write-Host "CUDA_PATH=$env:CUDA_PATH"

      - name: Install Ninja
        shell: pwsh
        run: choco install ninja -y

      - name: Build ggml-cuda
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          echo VSCMD_ARG_TGT_ARCH=%VSCMD_ARG_TGT_ARCH%
          if /I not "%VSCMD_ARG_TGT_ARCH%"=="x64" (
            echo Expected x64 MSVC toolchain, got %VSCMD_ARG_TGT_ARCH%
            exit /b 1
          )
          cmake -S . -B build\cuda -G "Ninja Multi-Config" ^
            -DBUILD_SHARED_LIBS=ON ^
            -DGGML_BACKEND_DL=ON ^
            -DGGML_NATIVE=OFF ^
            -DGGML_CPU=OFF ^
            -DGGML_CPU_ALL_VARIANTS=OFF ^
            -DGGML_VULKAN=OFF ^
            -DGGML_HIP=OFF ^
            -DGGML_CUDA=ON ^
            -DCUDAToolkit_ROOT="%CUDA_PATH%" ^
            -DGGML_CUDA_CUB_3DOT2=ON ^
            "-DCMAKE_CXX_FLAGS_RELEASE=/O2 /Ob2 /Zi /DNDEBUG" ^
            "-DCMAKE_C_FLAGS_RELEASE=/O2 /Ob2 /Zi /DNDEBUG" ^
            "-DCMAKE_SHARED_LINKER_FLAGS_RELEASE=/DEBUG /OPT:REF /OPT:ICF" ^
            "-DCMAKE_MODULE_LINKER_FLAGS_RELEASE=/DEBUG /OPT:REF /OPT:ICF"
          set /A NINJA_JOBS=%NUMBER_OF_PROCESSORS%-1
          if %NINJA_JOBS% LSS 1 set NINJA_JOBS=1
          cmake --build build\cuda --config Release -j %NINJA_JOBS% --target ggml-cuda
          echo === DLL files in build\cuda ===
          dir /s /b build\cuda\*.dll 2>nul || echo (none)
          echo === PDB files in build\cuda ===
          dir /s /b build\cuda\*.pdb 2>nul || echo (none)

      - name: Stage artifact
        shell: pwsh
        run: |
          $runtimeDir = "build/cuda/bin/cudart"
          New-Item -ItemType Directory -Force -Path $runtimeDir | Out-Null

          foreach ($root in @("$env:CUDA_PATH\bin", "$env:CUDA_PATH\lib", "$env:CUDA_PATH\bin\x64")) {
            if (Test-Path $root) {
              Copy-Item -Path "$root\cudart64_*.dll" -Destination $runtimeDir -Force -ErrorAction SilentlyContinue
              Copy-Item -Path "$root\cublas64_*.dll" -Destination $runtimeDir -Force -ErrorAction SilentlyContinue
              Copy-Item -Path "$root\cublasLt64_*.dll" -Destination $runtimeDir -Force -ErrorAction SilentlyContinue
            }
          }

          $stage = "artifact/windows-cuda"
          New-Item -ItemType Directory -Force -Path "$stage/bin" | Out-Null
          Copy-Item -Path "build/cuda/bin/Release/ggml-cuda.dll" -Destination "$stage/bin/" -Force
          # Search recursively for PDB; Ninja Multi-Config may write it to a subdirectory other than bin/Release
          $cudaPdb = Get-ChildItem -Path "build/cuda" -Filter "ggml-cuda.pdb" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($cudaPdb) {
            Copy-Item -Path $cudaPdb.FullName -Destination "$stage/bin/" -Force
            Write-Host "Copied PDB from: $($cudaPdb.FullName)"
          } else {
            Write-Warning "ggml-cuda.pdb not found in build/cuda – PDB may not have been generated"
          }
          Copy-Item -Path "$runtimeDir/*" -Destination "$stage/bin/" -Force -ErrorAction SilentlyContinue

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ggml-windows-x86_64-cuda
          path: artifact/windows-cuda
          if-no-files-found: error

  build-windows-x86_64-hip:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: ccache
        uses: ggml-org/ccache-action@v1.2.21
        with:
          key: windows-x86_64-hip-${{ env.WINDOWS_HIPSDK_INSTALLER_VERSION }}
          variant: ccache
          evict-old-files: 10d

      - name: Validate Windows x86_64 runner
        shell: pwsh
        run: |
          Write-Host "PROCESSOR_ARCHITECTURE=$env:PROCESSOR_ARCHITECTURE"
          Write-Host "Is64BitOS=$([Environment]::Is64BitOperatingSystem)"
          Write-Host "Is64BitProcess=$([Environment]::Is64BitProcess)"
          if (-not [Environment]::Is64BitOperatingSystem) {
            Write-Error "Expected 64-bit Windows runner"
            exit 1
          }
          if ($env:PROCESSOR_ARCHITECTURE -ne "AMD64") {
            Write-Error "Expected AMD64 runner, got $env:PROCESSOR_ARCHITECTURE"
            exit 1
          }

      - name: Grab rocWMMA package
        id: grab_rocwmma
        run: |
          curl -o rocwmma.deb "https://repo.radeon.com/rocm/apt/7.2/pool/main/r/rocwmma-dev/rocwmma-dev_2.2.0.70200-43~24.04_amd64.deb"
          7z x rocwmma.deb
          7z x data.tar

      - name: Cache ROCm installation
        id: cache-rocm
        uses: actions/cache@v5
        with:
          path: C:\Program Files\AMD\ROCm
          key: rocm-${{ env.WINDOWS_HIPSDK_INSTALLER_VERSION }}-${{ runner.os }}

      - name: Install AMD HIP SDK
        if: steps.cache-rocm.outputs.cache-hit != 'true'
        uses: ./.github/actions/windows-setup-rocm
        with:
          version: ${{ env.WINDOWS_HIPSDK_INSTALLER_VERSION }}

      - name: Verify AMD HIP SDK
        shell: pwsh
        run: |
          # Find and test ROCm installation
          $clangPath = Get-ChildItem 'C:\Program Files\AMD\ROCm\*\bin\clang.exe' | Select-Object -First 1
          if (-not $clangPath) {
            Write-Error "ROCm installation not found"
            exit 1
          }
          & $clangPath.FullName --version

      - name: Build ggml-hip
        shell: pwsh
        run: |
          $env:HIP_PATH = (Resolve-Path 'C:\Program Files\AMD\ROCm\*\bin\clang.exe' | Split-Path | Split-Path)
          $env:CMAKE_PREFIX_PATH = "$env:HIP_PATH"
          $rocwmmaInclude = Join-Path $PWD.Path "opt/rocm-7.2.0/include"
          if (-not (Test-Path $rocwmmaInclude)) {
            Write-Error "rocWMMA include path not found: $rocwmmaInclude"
            exit 1
          }
          cmake -G "Unix Makefiles" -B build/hip -S . `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_SHARED_LIBS=ON `
            -DGGML_BACKEND_DL=ON `
            -DGGML_NATIVE=OFF `
            -DGGML_CPU=OFF `
            -DGGML_CPU_ALL_VARIANTS=OFF `
            -DGGML_VULKAN=OFF `
            -DGGML_CUDA=OFF `
            -DGGML_HIP=ON `
            -DGPU_TARGETS="$env:WINDOWS_HIP_GPU_TARGETS" `
            -DGGML_HIP_ROCWMMA_FATTN=ON `
            -DCMAKE_C_COMPILER="$env:HIP_PATH\bin\clang.exe" `
            -DCMAKE_CXX_COMPILER="$env:HIP_PATH\bin\clang++.exe" `
            "-DCMAKE_CXX_FLAGS_RELEASE=-O3 -DNDEBUG -I$($rocwmmaInclude.Replace('\', '/'))/ -Wno-ignored-attributes -Wno-nested-anon-types -g -gcodeview"
          
          cmake --build build/hip --target ggml-hip -j $env:NUMBER_OF_PROCESSORS

          New-Item -ItemType Directory -Force -Path "build/hip/bin/rocblas/library" | Out-Null
          New-Item -ItemType Directory -Force -Path "build/hip/bin/hipblaslt/library" | Out-Null

          Copy-Item -Path "$env:HIP_PATH\bin\amd_comgr*.dll" -Destination "build/hip/bin/" -Force -ErrorAction SilentlyContinue
          Copy-Item -Path "$env:HIP_PATH\bin\amdhip64*.dll" -Destination "build/hip/bin/" -Force -ErrorAction SilentlyContinue
          Copy-Item -Path "$env:HIP_PATH\bin\hipblas.dll" -Destination "build/hip/bin/" -Force -ErrorAction SilentlyContinue
          Copy-Item -Path "$env:HIP_PATH\bin\libhipblas*.dll" -Destination "build/hip/bin/" -Force -ErrorAction SilentlyContinue
          Copy-Item -Path "$env:HIP_PATH\bin\rocblas.dll" -Destination "build/hip/bin/" -Force -ErrorAction SilentlyContinue
          Copy-Item -Path "$env:HIP_PATH\bin\rocblas\library\*" -Destination "build/hip/bin/rocblas/library/" -Force -Recurse -ErrorAction SilentlyContinue
          Copy-Item -Path "$env:HIP_PATH\bin\hipblaslt\library\*" -Destination "build/hip/bin/hipblaslt/library/" -Force -Recurse -ErrorAction SilentlyContinue

      - name: Stage artifact
        shell: pwsh
        run: |
          $stage = "artifact/windows-hip"
          New-Item -ItemType Directory -Force -Path "$stage/bin" | Out-Null
          Copy-Item -Path "build/hip/bin/*" -Destination "$stage/bin/" -Recurse -Force -ErrorAction SilentlyContinue

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ggml-windows-x86_64-hip
          path: artifact/windows-hip
          if-no-files-found: error

  assemble-windows-x86_64:
    needs:
      - build-windows-x86_64-base
      - build-windows-x86_64-cuda
      - build-windows-x86_64-hip
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21

      - name: Download base artifact
        uses: actions/download-artifact@v4
        with:
          name: ggml-windows-x86_64-base
          path: parts/base

      - name: Download CUDA artifact
        uses: actions/download-artifact@v4
        with:
          name: ggml-windows-x86_64-cuda
          path: parts/cuda

      - name: Download HIP artifact
        uses: actions/download-artifact@v4
        with:
          name: ggml-windows-x86_64-hip
          path: parts/hip

      - name: Merge Windows artifact
        shell: pwsh
        run: |
          $stage = "artifact/ggml-windows-x86_64"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          Copy-Item -Path "parts/base/*" -Destination $stage -Recurse -Force
          Copy-Item -Path "parts/cuda/bin/*" -Destination "$stage/bin/" -Force -ErrorAction SilentlyContinue
          Copy-Item -Path "parts/hip/bin/*" -Destination "$stage/bin/" -Recurse -Force -ErrorAction SilentlyContinue

          # Strip PDB files from the SDK zip – they are shipped in the separate PDB artifact
          Get-ChildItem -Path $stage -Filter "*.pdb" -Recurse -ErrorAction SilentlyContinue | Remove-Item -Force

          bun run generate-manifest `
            --stage $stage `
            --output "$stage/manifests.json" `
            --artifact-name "ggml-windows-x86_64" `
            --package-type "sdk-overlay" `
            --merge-target "ggml-sdk" `
            --os "windows" `
            --arch "x86_64" `
            --archive-format "zip" `
            --archive-file "ggml-windows-x86_64.zip" `
            --manifest-file "manifests.json" `
            --component "base" `
            --component "cuda" `
            --component "hip" `
            --backend "cpu" `
            --backend "vulkan" `
            --backend "cuda" `
            --backend "hip" `
            --source-part "ggml-windows-x86_64-base" `
            --source-part "ggml-windows-x86_64-cuda" `
            --source-part "ggml-windows-x86_64-hip" `
            --component-map "base|ggml-windows-x86_64-base|parts/base|." `
            --component-map "cuda|ggml-windows-x86_64-cuda|parts/cuda/bin|bin" `
            --component-map "hip|ggml-windows-x86_64-hip|parts/hip/bin|bin"
          Copy-Item -Path "$stage/manifests.json" -Destination "artifact/ggml-windows-x86_64.manifests.json" -Force

          Compress-Archive -Path $stage -DestinationPath "artifact/ggml-windows-x86_64.zip" -Force

      - name: Package Windows PDB artifact
        shell: pwsh
        run: |
          $pdbStage = "artifact/ggml-windows-x86_64-pdb"
          New-Item -ItemType Directory -Force -Path $pdbStage | Out-Null

          # Collect PDB files produced by each Windows build job
          Get-ChildItem -Path "parts/base" -Filter "*.pdb" -Recurse -ErrorAction SilentlyContinue |
            ForEach-Object { Copy-Item $_.FullName $pdbStage -Force }
          Get-ChildItem -Path "parts/cuda" -Filter "*.pdb" -Recurse -ErrorAction SilentlyContinue |
            ForEach-Object { Copy-Item $_.FullName $pdbStage -Force }
          Get-ChildItem -Path "parts/hip" -Filter "*.pdb" -Recurse -ErrorAction SilentlyContinue |
            ForEach-Object { Copy-Item $_.FullName $pdbStage -Force }

          $collected = @(Get-ChildItem -Path $pdbStage -File -ErrorAction SilentlyContinue)
          if ($collected.Count -eq 0) {
            Write-Warning "No PDB files found – PDB artifact will be empty"
          } else {
            Write-Host "Collected $($collected.Count) PDB file(s): $(($collected | Select-Object -ExpandProperty Name) -join ', ')"
          }

          Compress-Archive -Path "$pdbStage\*" -DestinationPath "artifact/ggml-windows-x86_64-pdb.zip" -Force

      - name: Upload SDK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ggml-windows-x86_64
          path: |
            artifact/ggml-windows-x86_64.zip
            artifact/ggml-windows-x86_64.manifests.json
          if-no-files-found: error

      - name: Upload PDB artifact
        uses: actions/upload-artifact@v4
        with:
          name: ggml-windows-x86_64-pdb
          path: artifact/ggml-windows-x86_64-pdb.zip
          if-no-files-found: warn

  release:
    needs:
      - assemble-linux-x86_64
      - build-macos-arm64
      - assemble-windows-x86_64
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event.inputs.create_release == 'true' }}
    steps:
      - name: Determine tag name
        id: tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "name=build-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Prepare release assets
        shell: bash
        run: |
          tag_name="${{ steps.tag.outputs.name }}"
          mkdir -p release
          cp "artifacts/ggml-linux-x86_64/ggml-linux-x86_64.tar.gz" "release/ggml-${tag_name}-linux-x86_64.tar.gz"
          cp "artifacts/ggml-linux-x86_64/ggml-linux-x86_64.manifests.json" "release/ggml-${tag_name}-linux-x86_64.manifests.json"
          cp "artifacts/ggml-macos-arm64/ggml-macos-arm64.tar.gz" "release/ggml-${tag_name}-macos-arm64.tar.gz"
          cp "artifacts/ggml-windows-x86_64/ggml-windows-x86_64.zip" "release/ggml-${tag_name}-windows-x86_64.zip"
          cp "artifacts/ggml-windows-x86_64/ggml-windows-x86_64.manifests.json" "release/ggml-${tag_name}-windows-x86_64.manifests.json"
          # PDB artifact: ship separately so the main SDK zip stays unchanged
          if [ -f "artifacts/ggml-windows-x86_64-pdb/ggml-windows-x86_64-pdb.zip" ]; then
            cp "artifacts/ggml-windows-x86_64-pdb/ggml-windows-x86_64-pdb.zip" "release/ggml-${tag_name}-windows-x86_64-pdb.zip"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.tag.outputs.name }}
          files: |
            release/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
